name: CI

on:
  push:
    branches: ["main"]
  pull_request:

permissions: {}

jobs:
  test:
    permissions:
      contents: read
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13"]
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Run the unit test suite
        env:
          PYTHONPATH: src
        run: python -m unittest discover -s tests -v

      - name: Run CLI smoke tests from source
        env:
          PYTHONPATH: src
        run: |
          python -m pyregexshield check "^[a-z0-9_-]{1,64}$"
          set +e
          python -m pyregexshield check "(a+)+" --json > redos.json
          status=$?
          set -e
          test "$status" -eq 1
          python - <<'PY'
          import json
          with open("redos.json", "r", encoding="utf-8") as handle:
              payload = json.load(handle)
          assert payload["safe"] is False
          assert payload["findings"]
          PY

      - name: Build source and wheel distributions
        run: |
          python -m pip install --require-hashes -r requirements-build.txt
          python -m build

      - name: Inspect wheel contents
        run: |
          python - <<'PY'
          import zipfile
          wheel = "dist/pyregexshield-1.0.0-py3-none-any.whl"
          with zipfile.ZipFile(wheel) as archive:
              names = archive.namelist()
          assert "pyregexshield/py.typed" in names
          assert not any(name.startswith("tests/") or "/tests/" in name for name in names)
          assert not any("__pycache__" in name or name.endswith(".pyc") for name in names)
          assert any(name.startswith("pyregexshield/") and name.endswith(".py") for name in names)
          PY

      - name: Install wheel and run installed CLI smoke test
        run: |
          python -m pip install --force-reinstall dist/pyregexshield-1.0.0-py3-none-any.whl
          pyregexshield check "^[a-z]+$"

      - name: Inspect source distribution contents
        run: |
          python - <<'PY'
          import tarfile
          with tarfile.open("dist/pyregexshield-1.0.0.tar.gz") as archive:
              names = set(archive.getnames())
          required = [
              "pyregexshield-1.0.0/README.md",
              "pyregexshield-1.0.0/LICENSE",
              "pyregexshield-1.0.0/SECURITY.md",
              "pyregexshield-1.0.0/CONTRIBUTING.md",
              "pyregexshield-1.0.0/src/pyregexshield/py.typed",
          ]
          missing = [name for name in required if name not in names]
          assert not missing, missing
          assert any(name.startswith("pyregexshield-1.0.0/tests/test_") for name in names)
          PY
